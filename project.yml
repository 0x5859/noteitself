name: noteitself
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  noteitself:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: noteitself
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: noteitself Note
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - $(NOTEITSELF_DOCUMENT_TYPE)
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(NOTEITSELF_DOCUMENT_TYPE)
            UTTypeDescription: noteitself Note
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - noteitself
                - sumi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NOTEITSELF_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MTL_FAST_MATH: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
  noteitselfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: noteitself
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(NOTEITSELF_BUNDLE_ID).tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/noteitself.app/noteitself"
        BUNDLE_LOADER: "$(TEST_HOST)"
  noteitselfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: noteitself
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(NOTEITSELF_BUNDLE_ID).uitests
        TEST_TARGET_NAME: noteitself
schemes:
  noteitself:
    build:
      targets:
        noteitself: all
        noteitselfTests: [test]
        noteitselfUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - noteitselfTests
        - noteitselfUITests
